<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Signal Lost</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --red: #d62828; --gold: #ffb800; --text: #f1f1f1; --text-dim: #9aa1ab;
  }
  body {
    margin: 0; height: 100vh; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; text-align: center; gap: 1rem; padding: 2rem;
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 12vw, 7rem); margin: 0;
    background: linear-gradient(135deg, var(--red), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: var(--text-dim); max-width: 40ch; }
  a {
    margin-top: 1rem; color: var(--gold); border: 1px solid var(--gold);
    padding: 0.8rem 1.6rem; border-radius: 4px; text-decoration: none;
    letter-spacing: 0.1em; font-size: 0.8rem; text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  a:hover { background: var(--gold); color: #14100a; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>SIGNAL LOST — this coordinate doesn't exist in the system. Telemetry rerouted below.</p>
  <a href="/">Return to Base</a>
</body>
</html>
